name: Wdróż demo na GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zainstaluj zależności
        run: npm ci
        working-directory: frontend

      - name: Zbuduj (z adresem backendu demo wstrzykniętym w czasie budowania)
        run: npm run build
        working-directory: frontend
        env:
          # UWAGA: podmień na rzeczywisty adres usługi z Render, jeśli będzie inny niż
          # nazwa usługi w render.yaml sugerowałaby (Render czasem dopisuje sufiks).
          VITE_API_URL: https://roko-flow-backend.onrender.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
